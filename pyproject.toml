[project]
name = "ex-oracle-ebs"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component>=1.9.0",
    "keboola-utils>=1.1.0",
    "oracledb>=2.5.0",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola-datadirtest>=0.0.0",
    "keboola-vcr>=0.0.0",
    "mock>=5.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.uv.sources]
keboola-datadirtest = { git = "https://github.com/keboola/datadirtest.git", branch = "feat/db-vcr-adapter" }
keboola-vcr = { git = "https://github.com/keboola/python-vcr-tests.git", branch = "feat/db-vcr-adapter" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
